<svg viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100c"/>
      <stop offset="0.55" stop-color="#0a1712"/>
      <stop offset="1" stop-color="#06100a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1f3b30"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.5"/>
  <circle cx="1010" cy="320" r="360" fill="url(#glow)"/>
  <rect x="0" y="0" width="8" height="640" fill="url(#acc)"/>

  <!-- right motif: concentric shield layers -->
  <g transform="translate(1010,320)" opacity="0.95">
    <g fill="none" stroke-linejoin="round">
      <path d="M0,-180 L150,-120 L150,40 Q150,150 0,205 Q-150,150 -150,40 L-150,-120 Z" stroke="#123026" stroke-width="2" fill="#0b1b15"/>
      <path d="M0,-140 L116,-93 L116,31 Q116,117 0,159 Q-116,117 -116,31 L-116,-93 Z" stroke="#1c4a3a" stroke-width="2"/>
      <path d="M0,-100 L83,-66 L83,22 Q83,84 0,113 Q-83,84 -83,22 L-83,-66 Z" stroke="#2c6b53" stroke-width="2"/>
      <path d="M0,-60 L50,-40 L50,13 Q50,50 0,68 Q-50,50 -50,13 L-50,-40 Z" stroke="url(#acc)" stroke-width="3"/>
    </g>
    <path d="M-22,2 L-6,20 L26,-20" fill="none" stroke="url(#acc)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(96,150)">
    <rect x="0" y="-34" width="150" height="30" rx="6" fill="#0e241b" stroke="#1c4a3a"/>
    <text x="16" y="-13" font-size="15" letter-spacing="2" font-weight="600" fill="#34d399">AI · SECURITY</text>

    <text x="0" y="78" font-size="92" font-weight="800" fill="#f0fdf8" letter-spacing="-1">GuardLayer</text>
    <text x="2" y="132" font-size="30" font-weight="600" fill="#a7f3d0">Runtime guardrails between an agent and its tools.</text>

    <text x="2" y="182" font-size="21" fill="#7fd1b4">Scan what it reads  ·  gate what it does  ·  remember the session —</text>
    <text x="2" y="212" font-size="21" fill="#7fd1b4">so a secret read earlier can't be exfiltrated later.</text>

    <!-- chips -->
    <g font-size="16" font-weight="600" fill="#c9f7e6">
      <g transform="translate(0,262)">
        <rect x="0" y="0" width="212" height="38" rx="19" fill="#0e241b" stroke="#1f4d3c"/>
        <text x="20" y="25">Prompt-injection defense</text>
      </g>
      <g transform="translate(224,262)">
        <rect x="0" y="0" width="128" height="38" rx="19" fill="#0e241b" stroke="#1f4d3c"/>
        <text x="20" y="25">Egress policy</text>
      </g>
      <g transform="translate(364,262)">
        <rect x="0" y="0" width="140" height="38" rx="19" fill="#0e241b" stroke="#1f4d3c"/>
        <text x="20" y="25">Session taint</text>
      </g>
      <g transform="translate(0,310)">
        <rect x="0" y="0" width="200" height="38" rx="19" fill="#0e241b" stroke="#1f4d3c"/>
        <text x="20" y="25">Tamper-evident audit</text>
      </g>
      <g transform="translate(212,310)">
        <rect x="0" y="0" width="188" height="38" rx="19" fill="#0e241b" stroke="#1f4d3c"/>
        <text x="20" y="25">Zero-dependency core</text>
      </g>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(96,600)" font-size="17" fill="#5f8f7e">
    <text x="0" y="0">github.com/Lijithvmv/Guard-Layer</text>
    <text x="1088" y="0" text-anchor="end" fill="#4b7a69">MIT  ·  Python 3.10–3.13  ·  ~0.2 ms / tool call</text>
  </g>
</svg>
