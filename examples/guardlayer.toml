# Example GuardLayer configuration.  Use with:
#   guardlayer --config examples/guardlayer.toml scan "..."
#   GuardLayer.from_config("examples/guardlayer.toml")
#   GUARDLAYER_CONFIG=examples/guardlayer.toml guardlayer serve

preset = "balanced"          # observe | balanced | strict | airgap  (`guardlayer presets`); settings below win

[guard]
flag_threshold = 0.4
block_threshold = 0.8
fail_closed = false          # true: block when any scanner errors (e.g. a model server is down)
auto_learn = true            # add newly blocked prompts to the similarity store
redaction_format = "[REDACTED:{rule}]"
mode = "enforce"             # "observe": record what WOULD happen (shadow_verdict), enforce nothing
observe = ["egress_raw_ip"]  # observe-only rules/categories (globs on rule, scanner:rule, category)
enforce = []                 # in observe mode, keep enforcing these (e.g. ["secret", "tool_policy:*"])

# category, or "direction:category" (more specific) -> score | block | flag | review | redact | log
[actions]
secret = "redact"
"output:pii" = "redact"
"input:pii" = "log"
policy = "block"

# Agent tool-call policy, applied by guard.scan_tool_call(...)
[tools]
allowlist = ["search", "calculator", "send_email", "bash", "mcp__github__*"]   # globs; omit to allow any tool
denylist = ["mcp__github__delete_*"]
egress_allowlist = ["example.com", "api.github.com"]   # omit to allow any domain except exfil services
remote_tools = ["kb_*"]              # extra tools whose results are untrusted and whose args leave the machine
capability_actions = { exec = "review" }               # hold every shell call for a human
rule_actions = { dotenv_file = "block" }               # change a built-in rule's action
disabled_rules = []
capabilities = { calculator = ["read"] }               # explicit tags beat name inference
rules = [
  { name = "no_prod_db", pattern = "prod-db\\.internal", action = "block", message = "Agents may not touch the production database." },
]

# Session taint tracking: judge a tool call by what the session has already read
[session]
store = "memory"                     # "file" + dir = "..." when each check is a new process (hooks)
trusted_tools = ["kb_search"]        # outputs never count as untrusted or hostile
untrusted_tools = ["read_email"]     # read-only tools whose output an outsider can write
actions = { sensitive_data_egress = "block", trifecta = "review", after_injection = "review" }

# Tamper-evident audit log (hash-chained JSONL; signed if a key is given)
[audit]
path = "guardlayer-audit.jsonl"
min_verdict = "flag"
# signing_key = "audit.key"  # guardlayer audit keygen audit; needs the `signing` extra

[scanners.heuristics]
rules_file = "custom_rules.toml"      # resolved relative to this file
disabled_rules = []

[scanners.similarity]
threshold = 0.55
# embedder = "st:sentence-transformers/all-MiniLM-L6-v2"   # needs the `embeddings` extra; retune threshold (~0.75)
# corpus_file = "my_attacks.txt"

[scanners.pii]
entities = ["email", "phone", "credit_card", "aadhaar", "indian_pan", "iban", "us_ssn"]

[scanners.links]
allowed_domains = ["example.com", "docs.python.org"]

[scanners.limits]
max_chars = 30000

[scanners.denylist]
terms = ["project nightingale"]
directions = ["input", "output"]

# [scanners.classifier]              # needs the `ml` extra (transformers + torch)
# threshold = 0.8
