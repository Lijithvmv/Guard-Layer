[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardlayer"
version = "0.4.1"
description = "A lightweight security layer that filters the inputs and outputs of LLM and agent applications — prompt injection, jailbreaks, leakage, secrets, PII and unsafe actions."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lijith V M" }]
keywords = [
    "llm", "security", "prompt-injection", "jailbreak", "guardrails", "ai-safety",
    "agents", "pii", "redaction", "owasp-llm-top-10",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []  # the core engine is pure standard library

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
embeddings = ["sentence-transformers>=2.7"]
ml = ["transformers>=4.40", "torch>=2.2"]
signing = ["cryptography>=42"]
langgraph = ["langgraph>=1.0"]
openai-agents = ["openai-agents>=0.22"]
toml = ["tomli>=2.0; python_version < '3.11'"]
dev = ["pytest>=8.0", "cryptography>=42", "ruff>=0.6", "httpx>=0.27", "fastapi>=0.110", "pydantic>=2.6", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
guardlayer = "guardlayer.cli:main"

[project.urls]
Homepage = "https://github.com/Lijithvmv/Guard-Layer"
Issues = "https://github.com/Lijithvmv/Guard-Layer/issues"
Changelog = "https://github.com/Lijithvmv/Guard-Layer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/guardlayer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # detection patterns are long by nature; line length is not meaningful here

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
