[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardlayer"
version = "0.1.0"
description = "A layered security scanner for LLM prompts and responses — detect prompt injection and jailbreaks."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lijith V M" }]
keywords = ["llm", "security", "prompt-injection", "jailbreak", "ai-safety", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # the core engine is pure standard library

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
guardlayer = "guardlayer.cli:main"

[project.urls]
Homepage = "https://github.com/Lijithvmv/Guard-Layer"

[tool.hatch.build.targets.wheel]
packages = ["src/guardlayer"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # detection patterns are long by nature; line length is not meaningful here

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
